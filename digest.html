<script>
(function () {
  var D = window.FBDigest, H = window.FBHub, e = D.esc;
  var view = document.getElementById('view');
  var id = new URLSearchParams(location.search).get('id');

  // ---------------- หน้ารายการ ----------------
  function renderList() {
    var S = D.state, rows = S.rows;
    var top = '<div class="page-top"><span class="eyebrow">MARKET DIGEST</span>' +
      '<h1>สรุปตลาด Options อเมริกา</h1>' +
      '<p>รายงานประจำวันภาษาไทย · อัปเดตอัตโนมัติทุกเช้าวันทำการ' +
      (rows && rows[0] ? ' · ล่าสุด ' + e(D.fmtMed(rows[0].digest_date)) : '') + '</p></div>';
    var body;
    if (!rows && S.error) body = '<div class="state"><b>โหลดรายงานไม่สำเร็จ</b>ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่<br><button class="btn btn-ghost btn-sm" id="retry">ลองใหม่</button></div>';
    else if (!rows) body = '<div class="dlist one">' + H.skelRows(5) + '</div>';
    else if (!rows.length) body = '<div class="state"><b>ยังไม่มีรายงาน</b>รายงานฉบับแรกจะมาถึงเช้าวันทำการถัดไป</div>';
    else {
      // จัดกลุ่มตามเดือน
      var out = '', lastM = '';
      rows.forEach(function (r, i) {
        var mk = String(r.digest_date).slice(0, 7);
        if (mk !== lastM) {
          if (lastM) out += '</div>';
          out += '<div class="month">' + e(D.fmtD(r.digest_date, { month: 'long', year: 'numeric' })) + '</div><div class="dlist one">';
          lastM = mk;
        }
        out += H.rowHTML(r, i === 0);
      });
      body = out + '</div>';
      if (S.error) body = '<div class="state" style="padding:14px;margin-bottom:14px">' + e(S.error) + '</div>' + body;
    }
    view.innerHTML = top + body + '<div style="height:20px"></div>';
    var rt = document.getElementById('retry');
    if (rt) rt.onclick = function () { D.loadList(true); };
  }

  // ---------------- หน้าอ่าน ----------------
  var row = null, loading = false, err = '';
  function renderReader() {
    var rows = D.state.rows || [];
    var idx = -1;
    for (var i = 0; i < rows.length; i++) if (String(rows[i].id) === String(id)) { idx = i; break; }
    var newer = idx > 0 ? rows[idx - 1] : null;
    var older = idx >= 0 && idx < rows.length - 1 ? rows[idx + 1] : null;

    var h = '<a class="back" href="digest.html">' + H.ICON.back + 'รายงานทั้งหมด</a>';
    if (!row && loading) {
      h += '<div class="article"><div class="skel" style="width:40%"></div><div class="skel" style="width:85%;height:24px;margin:16px 0 26px"></div>' +
        [92, 100, 78, 96, 64, 88].map(function (w) { return '<div class="skel" style="width:' + w + '%"></div>'; }).join('') + '</div>';
    } else if (!row) {
      h += '<div class="state"><b>' + e(err || 'ไม่พบรายงานฉบับนี้') + '</b>' +
        '<button class="btn btn-ghost btn-sm" id="retry">ลองใหม่</button></div>';
    } else {
      h += '<article class="article">' +
        '<div class="a-meta"><span class="pill">' + e(D.fmtLong(row.digest_date)) + '</span>' +
        (row.trading_day ? '<span class="a-meta-s">สรุปวันเทรด US · ' + e(D.fmtMed(row.trading_day)) + '</span>' : '') + '</div>' +
        '<h1 class="a-title">' + e(row.title || 'Market Digest') + '</h1>' +
        '<div class="md">' + D.md(D.stripDupTitle(row.content_md, row.title)) + '</div>' +
        '<div class="disclaimer-box">' + H.ICON.shield + '<span>' + e(D.DISCLAIMER) + '</span></div>' +
        '</article>' +
        '<div class="share"><button class="btn btn-ghost btn-sm" id="copyLink">คัดลอกลิงก์ฉบับนี้</button></div>';
    }
    if (newer || older) {
      h += '<div class="pager">' +
        (older ? '<a class="pg" href="' + H.link(older) + '"><span class="l">← ฉบับก่อนหน้า</span><span class="t">' + e(older.title || '') + '</span></a>' : '<div></div>') +
        (newer ? '<a class="pg r" href="' + H.link(newer) + '"><span class="l">ฉบับถัดไป →</span><span class="t">' + e(newer.title || '') + '</span></a>' : '<div></div>') +
        '</div>';
    }
    view.innerHTML = h + '<div style="height:20px"></div>';

    var rt = document.getElementById('retry');
    if (rt) rt.onclick = fetchRow;
    var cp = document.getElementById('copyLink');
    if (cp) cp.onclick = function () {
      var done = function () { cp.textContent = 'คัดลอกแล้ว ✓'; setTimeout(function () { cp.textContent = 'คัดลอกลิงก์ฉบับนี้'; }, 1800); };
      try { navigator.clipboard.writeText(location.href).then(done, function () { prompt('คัดลอกลิงก์', location.href); }); }
      catch (x) { prompt('คัดลอกลิงก์', location.href); }
    };
  }

  function applyMeta() {
    if (!row) return;
    document.title = (row.title || 'Market Digest') + ' | Fillbook Market Digest';
    var d = document.querySelector('meta[name="description"]');
    if (d) d.setAttribute('content', D.excerpt(D.stripDupTitle(row.content_md, row.title), 150));
  }

  function fetchRow() {
    loading = true; err = ''; renderReader();
    D.loadOne(id).then(function (r) {
      if (r) { row = r; D.markSeen(r.digest_date); applyMeta(); } else if (!row) err = 'ไม่พบรายงานฉบับนี้';
    }, function () { if (!row) err = 'โหลดรายงานไม่สำเร็จ — ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่'; })
      .then(function () { loading = false; renderReader(); });
  }

  if (id) {
    row = D.cachedOne(id);
    if (row) applyMeta();
    D.subscribe(renderReader);
    fetchRow();
    D.loadList(false);
  } else {
    D.subscribe(renderList);
    renderList();
    D.loadList(true);
  }
})();
</script>
